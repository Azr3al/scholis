id: attendance_tracking
label: Track attendance follow-up
scenario_packs:
  - attendance-story
demo_stops:
  - route: /shortcuts/todays-classes
    role: demo-teacher
    talk_track: Teachers can start from today's classes and jump into attendance actions quickly.
    look_for:
      - DEMO-Attendance-Story
  - route: /attendances/god-view
    role: demo-admin
    talk_track: Admin can review cross-course attendance trends to identify follow-up needs.
    look_for:
      - present
      - late
      - absent
